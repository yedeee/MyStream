<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZXL Player</title>
  
  <!-- Live Google Sans Flex Typeface Resource Integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e0e0e0;
      --dim: #888888;
      --accent: #a370f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      /* Font Family Update: Global assignment for system layout */
      font-family: 'Google Sans Flex', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end; 
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 700px;
    }
    
    /* 
      NESTING GEOMETRY MATH:
      Card Image Radius (Inner): 16px
      Card Container Padding: 16px
      Card Border Radius (Outer): 16px + 16px = 32px
    */
    .card {
      background: var(--panel);
      padding: 16px;
      border-radius: 32px; 
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-align: right; 
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px; 
      background: #2a2a2a;
    }
    .card h3 {
      font-size: 0.95rem;
      margin: 12px 0 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .card p {
      font-size: 0.8rem;
      color: var(--dim);
      margin: 0;
    }
    
    /* 
      NESTING GEOMETRY MATH:
      Track Item Radius (Inner): 12px
      Panel Workspace Padding: 24px
      Panel Border Radius (Outer): 12px + 24px = 36px
    */
    .view-panel {
      grid-column: 1 / -1;
      background: var(--panel);
      padding: 24px;
      border-radius: 36px; 
      display: none;
      box-sizing: border-box;
      text-align: right; 
    }
    .panel-header {
      display: flex;
      flex-direction: row-reverse; 
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 10px;
    }
    .panel-header h4 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
    }
    .panel-header span {
      font-size: 0.8rem;
      color: var(--dim);
    }
    .track-item {
      padding: 12px 16px;
      border-radius: 12px; 
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s ease;
      direction: rtl; 
    }
    .track-item:hover {
      background: #262626;
      color: var(--accent);
    }
    audio {
      width: 100%;
      margin-top: 20px;
      height: 40px;
      border-radius: 40px; 
    }
  </style>
</head>
<body>

  <div class="grid" id="main-grid">
    <!-- Active selection panel drops in here dynamically -->
    <div class="view-panel" id="player-view-panel">
      <div class="panel-header">
        <h4 id="panel-title">Loading Track...</h4>
        <span id="panel-artist">Artist</span>
      </div>
      <div id="tracklist-container"></div>
      <audio id="audio-element" controls></audio>
    </div>
  </div>

  <script>
    const musicDir = './music/';
    const mainGrid = document.getElementById('main-grid');
    const viewPanel = document.getElementById('player-view-panel');
    const tracklistContainer = document.getElementById('tracklist-container');
    const audioElement = document.getElementById('audio-element');
    const panelTitle = document.getElementById('panel-title');
    const panelArtist = document.getElementById('panel-artist');

    // 1. Fetch your master layout folder list (with cache buster)
    fetch(`library.json?v=${Date.now()}`)
      .then(res => res.json())
      .then(async folders => {
        for (let folder of folders) {
          try {
            const res = await fetch(`${musicDir}${folder}/metadata.json?v=${Date.now()}`);
            const meta = await res.json();
            createCard(meta, folder);
          } catch (err) {
            console.error(`Error loading folder context: ${folder}`, err);
          }
        }
      });

    // 2. Generate minimalist UI elements
    function createCard(meta, folderName) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const coverUrl = `${musicDir}${folderName}/${meta.cover}`;
      
      card.innerHTML = `
        <img src="${coverUrl}" alt="cover">
        <h3>${meta.name}</h3>
        <p>${meta.artist}</p>
      `;

      card.addEventListener('click', () => {
        if (meta.type === 'single') {
          tracklistContainer.innerHTML = ''; 
          viewPanel.style.display = 'block';
          play(meta.name, meta.artist, `${musicDir}${folderName}/${meta.file}`);
        } else if (meta.type === 'album') {
          showAlbumTracks(meta, folderName);
        }
      });

      mainGrid.insertBefore(card, viewPanel);
    }

    // 3. Populate tracks for albums
    function showAlbumTracks(meta, folderName) {
      panelTitle.innerText = meta.name;
      panelArtist.innerText = meta.artist;
      tracklistContainer.innerHTML = '';
      
      meta.tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerText = `${String(index + 1).padStart(2, '0')} . ${track.title}`;
        
        item.addEventListener('click', (e) => {
          e.stopPropagation(); 
          play(track.title, meta.artist, `${musicDir}${folderName}/${track.file}`);
        });
        
        tracklistContainer.appendChild(item);
      });
      
      viewPanel.style.display = 'block';
      viewPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 4. Update core browser player audio sources
    function play(title, artist, fileUrl) {
      panelTitle.innerText = title;
      panelArtist.innerText = artist;
      audioElement.src = fileUrl;
      audioElement.play();
    }
  </script>
</body>
</html>
