<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZXL Player</title>
  
  <!-- Live Google Sans Font Integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e0e0e0;
      --dim: #888888;
      --accent: #a370f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Google Sans', sans-serif;
      font-weight: 300; /* Normal text set to 300 weight */
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* Aligned back to the left */
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 700px;
    }
    
    /* 
      NESTING GEOMETRY MATH:
      Card Image Radius (Inner): 16px
      Card Container Padding: 16px
      Card Border Radius (Outer): 16px + 16px = 32px
    */
    .card {
      background: var(--panel);
      padding: 16px;
      border-radius: 32px; 
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-align: left; /* Left alignment */
    }
    .card:hover {
      transform: scale(1.03);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px; 
      background: #2a2a2a;
    }
    .card h3 {
      font-size: 0.95rem;
      margin: 12px 0 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700; /* Titles set to 700 weight */
    }
    .card p {
      font-size: 0.8rem;
      color: var(--dim);
      margin: 0;
      font-weight: 300;
    }
    
    /* 
      FULLSCREEN OVERLAY PANELS (ALBUM TOGGLE VIEW):
      Track Item Radius (Inner): 12px
      Panel Workspace Padding: 40px
      Panel Border Radius (Outer): 12px + 40px = 52px
    */
    .view-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      background: var(--panel);
      padding: 40px;
      border-radius: 52px; 
      display: none;
      box-sizing: border-box;
      text-align: left;
      z-index: 1000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow-y: auto;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 20px;
    }
    .panel-header h4 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700; /* Title weight */
    }
    .panel-header span {
      font-size: 1rem;
      color: var(--dim);
      font-weight: 300;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 2rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .close-btn:hover {
      color: var(--text);
    }
    .track-item {
      padding: 14px 16px;
      border-radius: 12px; 
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s ease;
    }
    .track-item:hover {
      background: #262626;
      color: var(--accent);
    }
    audio {
      width: 100%;
      margin-top: 30px;
      height: 44px;
      border-radius: 40px; 
    }
  </style>
</head>
<body>

  <div class="grid" id="main-grid">
    <!-- Fullscreen dynamic selection workspace portal -->
    <div class="view-panel" id="player-view-panel">
      <div class="panel-header">
        <div>
          <h4 id="panel-title">Loading Track...</h4>
          <span id="panel-artist">Artist</span>
        </div>
        <button class="close-btn" id="close-panel-btn">&times;</button>
      </div>
      <div id="tracklist-container"></div>
      <audio id="audio-element" controls></audio>
    </div>
  </div>

  <script>
    const musicDir = './music/';
    const mainGrid = document.getElementById('main-grid');
    const viewPanel = document.getElementById('player-view-panel');
    const tracklistContainer = document.getElementById('tracklist-container');
    const audioElement = document.getElementById('audio-element');
    const panelTitle = document.getElementById('panel-title');
    const panelArtist = document.getElementById('panel-artist');
    const closePanelBtn = document.getElementById('close-panel-btn');

    let currentOpenFolder = null;

    // 1. Fetch your master layout folder list (with cache buster)
    fetch(`library.json?v=${Date.now()}`)
      .then(res => res.json())
      .then(async folders => {
        for (let folder of folders) {
          try {
            const res = await fetch(`${musicDir}${folder}/metadata.json?v=${Date.now()}`);
            const meta = await res.json();
            createCard(meta, folder);
          } catch (err) {
            console.error(`Error loading folder context: ${folder}`, err);
          }
        }
      });

    // 2. Generate minimalist UI elements
    function createCard(meta, folderName) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const coverUrl = `${musicDir}${folderName}/${meta.cover}`;
      
      card.innerHTML = `
        <img src="${coverUrl}" alt="cover">
        <h3>${meta.name}</h3>
        <p>${meta.artist}</p>
      `;

      card.addEventListener('click', () => {
        // Toggle feature: If clicking the folder that is already open, close it
        if (currentOpenFolder === folderName) {
          closePanel();
          return;
        }

        currentOpenFolder = folderName;

        if (meta.type === 'single') {
          tracklistContainer.innerHTML = ''; 
          viewPanel.style.display = 'block';
          play(meta.name, meta.artist, `${musicDir}${folderName}/${meta.file}`);
        } else if (meta.type === 'album') {
          showAlbumTracks(meta, folderName);
        }
      });

      mainGrid.appendChild(card);
    }

    // 3. Populate tracks for albums
    function showAlbumTracks(meta, folderName) {
      panelTitle.innerText = meta.name;
      panelArtist.innerText = meta.artist;
      tracklistContainer.innerHTML = '';
      
      meta.tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerText = `${String(index + 1).padStart(2, '0')} . ${track.title}`;
        
        item.addEventListener('click', (e) => {
          e.stopPropagation(); 
          play(track.title, meta.artist, `${musicDir}${folderName}/${track.file}`);
        });
        
        tracklistContainer.appendChild(item);
      });
      
      viewPanel.style.display = 'block';
    }

    // 4. Close functions for the toggle
    function closePanel() {
      viewPanel.style.display = 'none';
      currentOpenFolder = null;
    }

    closePanelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closePanel();
    });

    // 5. Update core browser player audio sources
    function play(title, artist, fileUrl) {
      panelTitle.innerText = title;
      panelArtist.innerText = artist;
      audioElement.src = fileUrl;
      audioElement.play();
    }
  </script>
</body>
</html>
