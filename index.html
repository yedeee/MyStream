<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZXL Player</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e0e0e0;
      --dim: #888888;
      --accent: #a370f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px 20px 120px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 700px;
    }
    .card {
      background: var(--panel);
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      background: #2a2a2a;
    }
    .card h3 {
      font-size: 0.95rem;
      margin: 8px 0 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card p {
      font-size: 0.8rem;
      color: var(--dim);
      margin: 0;
    }
    /* Simple overlay tracklist for albums */
    .tracklist {
      grid-column: 1 / -1;
      background: var(--panel);
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    .track-item {
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .track-item:last-child { border: none; }
    .track-item:hover { color: var(--accent); }
    
    /* Minimal Player Bar */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--panel);
      box-sizing: border-box;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 1px solid #2a2a2a;
    }
    .info {
      font-size: 0.85rem;
      margin-bottom: 8px;
      text-align: center;
    }
    .info span { color: var(--dim); }
    audio {
      width: 100%;
      max-width: 400px;
      height: 32px;
    }
  </style>
</head>
<body>

  <h1>ZXL MUSIC</h1>
  
  <div class="grid" id="main-grid">
    <!-- Active album tracklist will drop in here dynamically -->
    <div class="tracklist" id="album-tracklist"></div>
  </div>

  <div class="player">
    <div class="info" id="track-info">Select music to begin <span></span></div>
    <audio id="audio-element" controls></audio>
  </div>

  <script>
    const musicDir = './music/';
    const mainGrid = document.getElementById('main-grid');
    const tracklistPanel = document.getElementById('album-tracklist');
    const audioElement = document.getElementById('audio-element');
    const trackInfo = document.getElementById('track-info');

    // 1. Fetch your master layout folder list
    fetch('library.json')
      .then(res => res.json())
      .then(async folders => {
        for (let folder of folders) {
          try {
            const res = await fetch(`${musicDir}${folder}/metadata.json`);
            const meta = await res.json();
            createCard(meta, folder);
          } catch (err) {
            console.error(`Error loading folder context: ${folder}`, err);
          }
        }
      });

    // 2. Generate minimalist UI elements
    function createCard(meta, folderName) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const coverUrl = `${musicDir}${folderName}/${meta.cover}`;
      
      card.innerHTML = `
        <img src="${coverUrl}" alt="cover">
        <h3>${meta.name}</h3>
        <p>${meta.artist}</p>
      `;

      card.addEventListener('click', () => {
        if (meta.type === 'single') {
          tracklistPanel.style.display = 'none'; // hide tracklist if viewing a single
          play(meta.name, meta.artist, `${musicDir}${folderName}/${meta.file}`);
        } else if (meta.type === 'album') {
          showAlbumTracks(meta, folderName);
        }
      });

      // Insert card before the tracklist panel container
      mainGrid.insertBefore(card, tracklistPanel);
    }

    // 3. Show tracks when an album card is clicked
    function showAlbumTracks(meta, folderName) {
      tracklistPanel.innerHTML = `<strong style="font-size:0.85rem; color:var(--dim);">TRACKLIST: ${meta.name}</strong>`;
      
      meta.tracks.forEach(track => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerText = track.title;
        
        item.addEventListener('click', (e) => {
          e.stopPropagation(); // Stops parent container click triggers
          play(track.title, meta.artist, `${musicDir}${folderName}/${track.file}`);
        });
        
        tracklistPanel.appendChild(item);
      });
      
      tracklistPanel.style.display = 'block';
      tracklistPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 4. Update core browser player audio sources
    function play(title, artist, fileUrl) {
      trackInfo.innerHTML = `${title} - <span>${artist}</span>`;
      audioElement.src = fileUrl;
      audioElement.play();
    }
  </script>
</body>
</html>
